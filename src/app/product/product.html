<div class="product">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Search products..." />
    <ul>
        <li (click)="onProductClick(product)" *ngFor="let product of filteredProducts()">
            <span>{{ product.name }}</span>
            <span>{{ product.price | currency }}</span>
            <button (click)="onAddToCart(product)">Add to Cart</button>   
        </li>
    </ul>
</div>
